      * { box-sizing: border-box; }

        color: var(--ink);
        font: 14px/1.55 "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      header.top {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(20, 22, 28, 0.94);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line);
        padding: 14px 22px;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: baseline;
      }
      header.top h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: 0.01em; }
      header.top .sub { color: var(--dim); font-size: 12px; }
      .spacer { flex: 1; }
      .switch { display: flex; gap: 6px; }
      .switch button {
        font: inherit;
        font-size: 12px;
        padding: 4px 11px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #1c1f26;
        color: var(--dim);
        cursor: pointer;
      }
      .switch button.on { border-color: var(--accent); background: rgba(124, 199, 245, 0.14); color: #cfe9fb; }
      nav#runnav { display: flex; gap: 8px; flex-wrap: wrap; }
      nav#runnav a {
        font-size: 12px;
        color: var(--dim);
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 3px 10px;
      }
      nav#runnav a:hover { color: var(--ink); border-color: var(--accent); }
      nav#runnav small { opacity: 0.6; }

      main { padding: 22px; }
      .run { margin-bottom: 42px; }
      .run-h {
        font-size: 13px;
        font-weight: 500;
        color: var(--dim);
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
        margin: 0 0 20px;
        display: flex;
        gap: 12px;
        align-items: baseline;
      }
      .run-h .rn { color: var(--ink); font-weight: 700; font-size: 15px; }
      .run-h small { margin-left: auto; opacity: 0.7; }

      .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(560px, 1fr)); }
      .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
      .tile-h h3 { margin: 0; font-size: 16px; display: flex; align-items: baseline; gap: 8px; }
      .tile-h h3 .id { font: 11px "Roboto Mono", monospace; color: var(--dim); }
      .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 7px 0 12px; }
      .pill { font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--dim); }
      .pill-dark { border-color: #3b4256; background: #171b24; }
      .pill-light { border-color: #cbd5e1; background: #eef2f7; color: #1e293b; }
      .sw { width: 15px; height: 15px; border-radius: 4px; display: inline-block; border: 1px solid rgba(255, 255, 255, 0.22); }

      .faces { display: flex; gap: 12px; align-items: flex-start; }
      .fig { margin: 0; }
      .fig figcaption { font-size: 10px; color: var(--dim); text-align: center; padding-top: 5px; letter-spacing: 0.08em; text-transform: uppercase; }
      .face { overflow: hidden; border-radius: 6px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45); }
      .face-inner {
        transform-origin: top left;
        position: relative;
        overflow: hidden;
        padding: 10px;
        box-sizing: border-box;
        background-position: center;
        background-size: cover;
      }
      .fig.side-art img { width: 172px; border-radius: 6px; display: block; border: 1px solid var(--line); }

      body[data-side="front"] .side-back, body[data-side="back"] .side-front { display: none; }
      body[data-side="art"] .side-front, body[data-side="art"] .side-back { display: none; }
      /* !important on purpose: a design sets display on Competition Item, and this is the review
         tool's own switch rather than part of the card. */
      body[data-load="typical"] .ci.extra { display: none !important; }

      .warn { margin: 11px 0 0; font-size: 11px; color: #e6b566; }
      .blurb { margin: 13px 0 8px; font-size: 13px; color: #c9d2e2; }
      .notes { display: grid; grid-template-columns: 84px 1fr; gap: 3px 10px; margin: 0 0 10px; font-size: 12px; }
      .notes dt { color: #6d7484; }
      .notes dd { margin: 0; color: var(--dim); }
      details summary { cursor: pointer; font-size: 12px; color: var(--dim); }
      pre { background: #11131a; border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; font: 11px/1.5 "Roboto Mono", monospace; color: #b6c2d6; white-space: pre-wrap; }
      pre.code { white-space: pre; color: #a9d3b4; }
