<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Release in progress - eTalenter</title>
    <link rel="icon" href="/Content/Images/favicon.png" />
    <style>
        /* Same faces the portal uses (Content/lightweight.css). Served during a release
           because the middleware always lets /content/ and font files through; the system
           stack below keeps the page on-brand if they ever do not load. */
        @font-face {
            font-family: 'Quicksand-Medium';
            src: url(/Content/Quicksand/Quicksand-Medium.ttf) format("truetype");
            font-display: swap;
        }

        @font-face {
            font-family: 'Quicksand-Bold';
            src: url(/Content/Quicksand/Quicksand-Bold.ttf) format("truetype");
            font-display: swap;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            /* The portal header's gradient (.header in Content/lightweight.css). */
            background-color: #051424;
            background-image: linear-gradient(135deg, #051424, #051424, #0e2238, #142d4e, #1a3d63, #034273, #043c69, #0e3f67, #0f3b61, #0b2944, #081e34, #0d233c);
            font-family: 'Quicksand-Medium', 'Quicksand', 'Segoe UI', Tahoma, Arial, sans-serif;
            color: #0d233c;
        }

        .brand {
            width: 210px;
            max-width: 60vw;
            margin-bottom: 26px;
        }

        .card {
            width: 100%;
            max-width: 540px;
            background: #fff;
            border-radius: 14px;
            padding: 38px 36px 32px;
            text-align: center;
            box-shadow: 0 12px 20px -10px rgba(68, 134, 244, .1), 0 4px 20px 0 rgba(0, 0, 0, .12), 0 7px 8px -5px rgba(0, 188, 212, .2);
        }

        h1 {
            margin: 0 0 12px;
            font-family: 'Quicksand-Bold', 'Quicksand', 'Segoe UI', Tahoma, Arial, sans-serif;
            font-size: 23px;
            font-weight: 700;
            color: #051424;
        }

        p {
            margin: 0 0 16px;
            font-size: 15px;
            line-height: 1.65;
            color: #5b6b7c;
        }

        .eta {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 18px;
            border-radius: 999px;
            background: #e8f4fd;
            color: #075b9b;
            font-family: 'Quicksand-Bold', 'Quicksand', 'Segoe UI', Tahoma, Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
        }

        .bar {
            height: 5px;
            border-radius: 999px;
            background: #e9eef3;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .bar span {
            display: block;
            height: 100%;
            width: 30%;
            border-radius: 999px;
            background: linear-gradient(90deg, #029be3, #0f7fd9);
            animation: slide 1.8s ease-in-out infinite;
        }

        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(340%); }
        }

        button {
            padding: 11px 26px;
            border: 0;
            border-radius: 6px;
            background-image: linear-gradient(60deg, #029be3, #0f7fd9);
            color: #fff;
            font-family: 'Quicksand-Bold', 'Quicksand', 'Segoe UI', Tahoma, Arial, sans-serif;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .3px;
            cursor: pointer;
            box-shadow: 0 6px 14px -6px rgba(2, 155, 227, .8);
        }

        button:hover { background-image: linear-gradient(60deg, #0f7fd9, #075b9b); }

        .meta {
            margin: 16px 0 0;
            font-size: 12.5px;
            color: #8a99a8;
        }

        .support {
            margin-top: 22px;
            font-size: 12.5px;
            color: rgba(255, 255, 255, .65);
            text-align: center;
        }

        .support a { color: rgba(255, 255, 255, .9); }

        @media (max-width: 480px) {
            .card { padding: 30px 22px 26px; }
            h1 { font-size: 20px; }
        }
    </style>
</head>

        <button type="button" onclick="window.location.reload()">Check now</button>
        <p class="meta" id="status">Checking again in 15 seconds...</p>
        <p class="meta" id="release"></p>
    </div>

    <p class="support">Need help? <a href="mailto:support@etalenter.com">support@etalenter.com</a></p>

    <script>
        // Replaced by ReleaseOfflineMiddleware with the marker file written by the release pipeline.
        var RELEASE_INFO = /*RELEASE_INFO*/null;

        var CHECK_INTERVAL_SECONDS = 15;
        var secondsLeft = CHECK_INTERVAL_SECONDS;

        function field(source, name) {
            if (!source) return undefined;
            var camel = name.charAt(0).toLowerCase() + name.slice(1);
            return source[name] !== undefined ? source[name] : source[camel];
        }

        function renderReleaseInfo() {
            if (!RELEASE_INFO) return;

            var etaMinutes = field(RELEASE_INFO, 'EtaMinutes');
            var startedAtUtc = field(RELEASE_INFO, 'StartedAtUtc');
            var releaseId = field(RELEASE_INFO, 'ReleaseId');

            if (etaMinutes && startedAtUtc) {
                var raw = String(startedAtUtc);
                var startedAt = new Date(raw.charAt(raw.length - 1) === 'Z' ? raw : raw + 'Z').getTime();
                if (!isNaN(startedAt)) {
                    var remaining = Math.max(1, Math.ceil(etaMinutes - (Date.now() - startedAt) / 60000));
                    document.getElementById('eta').textContent =
                        'Expected to finish in about ' + remaining + ' minute' + (remaining === 1 ? '' : 's');
                }
            } else if (etaMinutes) {
                document.getElementById('eta').textContent =
                    'Expected to finish in about ' + etaMinutes + ' minutes';
            }

            if (releaseId) {
                document.getElementById('release').textContent = 'Release ' + releaseId;
            }
        }

        // The site answers 503 while the marker file is in place and 200 once the release is done,
        // so a successful probe means the new build is live.
        function probe() {
            var request = new XMLHttpRequest();
            request.open('HEAD', '/?releaseProbe=' + Date.now(), true);
            request.timeout = 8000;
            request.onload = function () {
                if (request.status >= 200 && request.status < 400) {
                    document.getElementById('status').textContent = 'Release finished - reloading...';
                    window.location.reload();
                }
            };
            // No response at all means the app is still restarting; keep waiting.
            request.onerror = function () { };
            request.ontimeout = function () { };
            request.send();
        }

        function tick() {
            secondsLeft--;

            if (secondsLeft <= 0) {
                secondsLeft = CHECK_INTERVAL_SECONDS;
                document.getElementById('status').textContent = 'Checking for the new version...';
                probe();
                return;
            }

            document.getElementById('status').textContent =
                'Checking again in ' + secondsLeft + ' second' + (secondsLeft === 1 ? '' : 's') + '...';
        }

        renderReleaseInfo();
        setInterval(tick, 1000);
        setInterval(renderReleaseInfo, 30000);

        // Belt and braces: a full reload every 60s in case the probe is blocked by a proxy.
        setInterval(function () { window.location.reload(); }, 60000);
    </script>
</body>
</html>
